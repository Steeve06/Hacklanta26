# Render Blueprint for the backend. Not deployed by default: see DEPLOY.md.
# The worker runs background jobs (schedule generation, notification batches);
# the cron job runs the periodic scans every 10 minutes, so Celery Beat is off.
envVarGroups:
  - name: pulse-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: USE_CELERY_BEAT
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: SOLVER
        value: greedy
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_MODEL_PLANNER
        value: claude-sonnet-5-5
      - key: AI_MODEL_LIGHT
        value: claude-haiku-5-5
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: DJANGO_SECRET_KEY
        generateValue: true

services:
  - type: web
    name: pulse-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60
    healthCheckPath: /api/health
    disk:
      name: pulse-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - fromGroup: pulse-shared
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pulse-kv
          property: connectionString
      - key: AI_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: worker
    name: pulse-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker --loglevel=info --concurrency=2
    envVars:
      - fromGroup: pulse-shared
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pulse-kv
          property: connectionString
      - key: AI_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: cron
    name: pulse-periodic
    runtime: python
    rootDir: backend
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_periodic
    envVars:
      - fromGroup: pulse-shared
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pulse-kv
          property: connectionString

  - type: keyvalue
    name: pulse-kv
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: pulse-db
    plan: free
    databaseName: pulse
    user: pulse
