x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DATABASE_URL: postgres://pulse:pulse@db:5432/pulse
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./backend:/app
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  web:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info --concurrency=2

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://web:8000
      VITE_DEMO_MODE: "true"
      VITE_POLL: "true"
    env_file: .env
    ports: ["5173:5173"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on: [web]

  # Optional, for phones: the built app (a few files, like a real deployment, so it loads quickly
  # over a tunnel) on http://localhost:4173, proxying the API to Django. Start it with
  #   docker compose --profile phone up -d phone
  # then give it an HTTPS address with `cloudflared tunnel --url http://localhost:4173`, or the
  # tunnel service below. Rebuilt from your current code each time it starts.
  phone:
    build: ./frontend
    command: sh -c "npx vite build && npx vite preview --host 0.0.0.0 --port 4173 --strictPort"
    environment:
      VITE_PROXY_TARGET: http://web:8000
      VITE_DEMO_MODE: "true"
    ports: ["4173:4173"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on: [web]
    profiles: [phone]

  # The HTTPS tunnel in a container. On networks that inspect HTTPS (many school and office
  # networks) it can't connect; run cloudflared on the host instead, or use a phone hotspot.
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    command: tunnel --no-autoupdate --url http://phone:4173
    depends_on: [phone]
    profiles: [phone]

volumes:
  pgdata:
  media:
