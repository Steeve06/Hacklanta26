<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Your study plan, study checks and reminders." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Leon" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap"
      rel="stylesheet"
    />
    <title>Leon</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If Leon fails to start, say so on the page instead of leaving it blank.
      (function () {
        var errors = [];
        function show() {
          var root = document.getElementById("root");
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="font-family: system-ui, sans-serif; padding: 24px; max-width: 32rem">' +
            '<h1 style="font-size: 20px">Leon couldn\'t start</h1>' +
            "<p>Try reloading. If this keeps happening, send this message to the team:</p>" +
            '<pre style="white-space: pre-wrap; font-size: 12px; background: #eee; padding: 8px"></pre>' +
            "</div>";
          root.querySelector("pre").textContent =
            (errors.join("\n") || "Nothing loaded after 10 seconds.") + "\n" + navigator.userAgent;
        }
        window.addEventListener("error", function (e) {
          errors.push(e.message + (e.filename ? " (" + e.filename + ":" + e.lineno + ")" : ""));
          setTimeout(show, 300);
        });
        window.addEventListener("unhandledrejection", function (e) {
          errors.push(
            "Unhandled: " + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason),
          );
          setTimeout(show, 300);
        });
        setTimeout(show, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
